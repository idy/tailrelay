name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            arch: arm64
          - runner: macos-15
            goos: darwin
            arch: arm64
          - runner: macos-15-intel
            goos: darwin
            arch: amd64
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GOMAXPROCS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate source, race tests and offline configuration
        run: |
          test -z "$(gofmt -l .)"
          sh -n install.sh
          make test check
          python3 -B -m unittest discover -s tests/installer
          python3 -B -m unittest discover -s tests/packaging
      - name: Build release binaries, packages and license notices
        run: python3 -I -B packaging/release.py build --os '${{ matrix.goos }}' --arch '${{ matrix.arch }}' --tag "$RELEASE_TAG"
      - name: Verify native Debian package lifecycle
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
          sudo bash tests/packaging/install.sh 'bin/deb/${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.arch }}
          path: bin/release/assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify and publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: bin/release/assets
          merge-multiple: true
      - name: Verify all architectures and publish without replacing assets
        run: python3 -I -B packaging/release.py publish --tag "$RELEASE_TAG"
